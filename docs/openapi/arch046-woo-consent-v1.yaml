openapi: 3.1.0
info:
  title: Moda Interact Woo checkout consent transport
  version: woo.whatsapp-consent.v1
  description: >-
    PHP-server-only, authenticated recording of user-selected WhatsApp
    abandoned-checkout marketing permission. Does not enqueue recovery work.
paths:
  /v1/woocommerce/whatsapp-consent:
    post:
      operationId: recordWooCheckoutMarketingConsent
      summary: Record a verified WooCommerce checkout checkbox decision
      description: >-
        Authenticate the active installation, recheck its current status and
        checkout-recovery feature eligibility for GRANT, and atomically persist
        current CustomerPhone permission with immutable Woo consent evidence.
        Customer-facing browsers MUST NOT call this route directly; WordPress
        PHP must verify the actual checkout request, nonce/session and action.
      security:
        - WooBearer: []
          WooInstallationId: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WooConsentEvent'
      responses:
        '200':
          description: Committed event or original immutable idempotent result
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WooConsentResponse'
        '400':
          description: Invalid/forged request or checkout assertion
        '401':
          description: Missing, invalid, revoked or rotated installation
        '409':
          description: Event replay conflict, stale choice, ambiguous phone or disabled grant
        '413':
          description: Request exceeds 8192 bytes
        '422':
          description: Unverifiable or mismatched phone recipient
        '503':
          description: No durable consent acknowledgement; request can be retried
components:
  securitySchemes:
    WooBearer:
      type: http
      scheme: bearer
      description: Existing installation-issued 32-byte secret encoded as base64url
    WooInstallationId:
      type: apiKey
      in: header
      name: X-Moda-Installation-Id
  schemas:
    WooConsentEvent:
      type: object
      additionalProperties: false
      required: [schemaVersion, eventId, decision, purpose, canonicalPhone, checkoutAction, disclosure]
      properties:
        schemaVersion:
          const: woo.whatsapp-consent.v1
        eventId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:~-]{0,127}$'
        decision:
          enum: [GRANT, REVOKE]
        purpose:
          const: WHATSAPP_CHECKOUT_RECOVERY
        canonicalPhone:
          type: string
          maxLength: 15
          pattern: '^[1-9][0-9]{1,14}$'
        checkoutAction:
          $ref: '#/components/schemas/VerifiedCheckoutAction'
        disclosure:
          oneOf:
            - $ref: '#/components/schemas/MarketingDisclosure'
            - type: 'null'
      allOf:
        - if:
            properties:
              decision:
                const: GRANT
          then:
            properties:
              disclosure:
                $ref: '#/components/schemas/MarketingDisclosure'
    VerifiedCheckoutAction:
      type: object
      additionalProperties: false
      required: [checkoutKey, checkoutMode, source, fieldId, selection,
        userInitiated, nonceVerified, sessionVerified, serverObservedPhone,
        verifiedCountryCode, occurredAt]
      properties:
        checkoutKey:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:~-]{0,127}$'
        checkoutMode:
          enum: [CLASSIC, BLOCKS]
        source:
          const: WOO_CHECKOUT_SERVER_HOOK
        fieldId:
          const: moda/whatsapp-checkout-recovery
        selection:
          enum: [CHECKED, UNCHECKED]
        userInitiated:
          const: true
        nonceVerified:
          const: true
        sessionVerified:
          const: true
        serverObservedPhone:
          type: string
          minLength: 1
          maxLength: 64
        verifiedCountryCode:
          oneOf:
            - type: string
              pattern: '^[A-Z]{2}$'
            - type: 'null'
        occurredAt:
          type: string
          description: UTC millisecond ISO-8601, strictly increasing by recipient
          pattern: '^\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d\.\d{3}Z$'
    MarketingDisclosure:
      type: object
      additionalProperties: false
      required: [version, locale, text, merchantSiteUrl]
      properties:
        version:
          const: moda.woo.whatsapp-recovery-marketing.v1
        locale:
          type: string
          minLength: 2
          maxLength: 64
        text:
          type: string
          minLength: 1
          maxLength: 4000
        merchantSiteUrl:
          type: string
          minLength: 1
          maxLength: 512
    WooConsentResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, status, decision, consentRevision, decisionSequence]
      properties:
        schemaVersion:
          const: woo.whatsapp-consent.v1
        status:
          enum: [recorded, duplicate]
        decision:
          enum: [GRANT, REVOKE]
        consentRevision:
          type: string
          pattern: '^[1-9][0-9]*$'
        decisionSequence:
          type: string
          pattern: '^[1-9][0-9]*$'
