openapi: 3.1.0
info:
  title: Moda Interact WooCommerce Merchant Recovery Outreach History
  version: 1.0.0
  description: >-
    Read-only delivery evidence and physical retry history for the two logical
    outreach slots. Recorded decisions are not dispatch authorizations or
    promises of future execution. The existing recovery detail v1 contract is unchanged.
security:
  - installationBearer: []
    installationId: []
paths:
  /v1/merchant/recoveries/{recoveryId}/outreach:
    get:
      operationId: readMerchantRecoveryOutreach
      parameters:
        - name: recoveryId
          in: path
          required: true
          schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,191}$" }
      responses:
        "200":
          description: Same-shop recovery history; private, no-store. Maximum 100 physical attempts across both slots.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OutreachProjection" }
        "400": { description: Invalid path, body or query }
        "401": { description: Invalid installation authentication }
        "404": { description: Missing or foreign recovery }
        "409":
          {
            description: Invalid ownership evidence or history exceeds the bound,
          }
        "500": { description: Internal read failure }
components:
  securitySchemes:
    installationBearer: { type: http, scheme: bearer }
    installationId: { type: apiKey, in: header, name: x-moda-installation-id }
  schemas:
    OutreachProjection:
      type: object
      additionalProperties: false
      required: [schemaVersion, recoveryId, initial, followUp]
      properties:
        schemaVersion: { type: integer, const: 1 }
        recoveryId: { type: string, pattern: "^[A-Za-z0-9_-]{1,191}$" }
        initial: { $ref: "#/components/schemas/Slot" }
        followUp: { $ref: "#/components/schemas/Slot" }
    Slot:
      type: object
      additionalProperties: false
      required: [state, currentSequence, history]
      properties:
        state: { type: string, enum: [MISSING, CURRENT, CONFLICT] }
        currentSequence:
          description: Physical sequence of the current valid lineage, null for missing or conflicting lineage.
          type: [integer, "null"]
          minimum: 1
          maximum: 2147483647
        history:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/Attempt" }
    Attempt:
      type: object
      additionalProperties: false
      required:
        [
          sequence,
          retry,
          initiatedBy,
          attemptStatus,
          deliveryState,
          sentAt,
          deliveredAt,
          readAt,
          failedAt,
          retryDecision,
          retryNotBeforeAt,
        ]
      properties:
        sequence: { type: integer, minimum: 1, maximum: 2147483647 }
        retry:
          {
            type: boolean,
            description: Physical retry,
            never another logical outreach entitlement.,
          }
        initiatedBy:
          { type: [string, "null"], enum: [HUMAN, AGENT, AUTOMATION, null] }
        attemptStatus:
          {
            type: string,
            enum:
              [
                PENDING,
                WAITING_FOR_RESPONSE,
                ENGAGED,
                NO_RESPONSE,
                CAPACITY_BLOCKED,
                CANCELLED,
                FAILED,
              ],
          }
        deliveryState:
          type: string
          enum:
            [
              NO_RECORDED_SUBMISSION,
              UNCONFIRMED,
              PROVIDER_ACCEPTED,
              DELIVERED,
              READ,
              FAILED,
            ]
        sentAt: { type: [string, "null"], format: date-time }
        deliveredAt: { type: [string, "null"], format: date-time }
        readAt: { type: [string, "null"], format: date-time }
        failedAt: { type: [string, "null"], format: date-time }
        retryDecision:
          type: string
          enum:
            [
              NONE,
              SUCCESSOR_CREATED,
              CANCELLED,
              STALE,
              UNKNOWN,
              AFTER_COOLDOWN,
              PROVIDER_POLICY_HOLD,
              REPAIR_REQUIRED,
              REVIEW_REQUIRED,
              DO_NOT_RETRY,
            ]
        retryNotBeforeAt:
          description: Recorded lower time bound, not guaranteed scheduling or send eligibility.
          type: [string, "null"]
          format: date-time
