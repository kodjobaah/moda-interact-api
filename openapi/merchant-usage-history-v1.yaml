openapi: 3.1.0
info:
  title: Moda Interact WooCommerce Merchant Usage History API
  version: 1.0.0
  description: >-
    Read-only merchant usage and Moda entitlement-period history. The billing period
    is not the WooCommerce payment-provider billing month. Free usage has no
    synthetic billing-period identifier. No provider accounting handles are exposed.
servers:
  - url: /
paths:
  /v1/merchant/usage-history:
    get:
      operationId: getWooMerchantUsageHistory
      summary: Authenticated Shop-scoped chronological usage and entitlement periods
      security:
        - InstallationBearer: []
          InstallationId: []
      parameters:
        - name: view
          in: query
          schema: { type: string, enum: [current, past], default: current }
        - name: periodId
          in: query
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,128}$' }
        - name: kind
          in: query
          schema: { type: string, enum: [ALL, RECOVERY_CONVERSATION], default: ALL }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, enum: [10, 25, 50, 100], default: 10 }
        - name: periodCursor
          in: query
          description: Opaque, signed, installation/Shop/view-bound period seek token
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,1024}$' }
      responses:
        '200':
          description: No-store read from existing Shop-owned usage and entitlement records
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsageHistory' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/Internal' }
components:
  securitySchemes:
    InstallationBearer: { type: http, scheme: bearer }
    InstallationId: { type: apiKey, in: header, name: x-moda-installation-id }
  schemas:
    Period:
      type: object
      additionalProperties: false
      required: [id, periodStart, periodEnd]
      properties:
        id: { type: string, pattern: '^[A-Za-z0-9_-]{1,191}$' }
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }
    PeriodPage:
      type: object
      additionalProperties: false
      required: [items, previousCursor, nextCursor]
      properties:
        items:
          type: array
          maxItems: 25
          items: { $ref: '#/components/schemas/Period' }
        previousCursor: { type: [string, 'null'], maxLength: 1024 }
        nextCursor: { type: [string, 'null'], maxLength: 1024 }
    RecoverySource:
      type: object
      additionalProperties: false
      required: [recoveryId, customerName]
      properties:
        recoveryId: { type: string, pattern: '^[A-Za-z0-9_-]{1,191}$' }
        customerName: { type: [string, 'null'], maxLength: 160 }
    UsageEvent:
      type: object
      additionalProperties: false
      required: [id, metric, quantity, occurredAt, sourceRecovery]
      properties:
        id: { type: string, pattern: '^[A-Za-z0-9_-]{1,191}$' }
        metric:
          type: string
          enum: [RECOVERY_CONVERSATION, OUTBOUND_AUTOMATED_MESSAGE, DELIVERED_WHATSAPP_MESSAGE, RECOVERY_CREDIT_PACK_PURCHASE]
        quantity: { type: number, description: Signed authoritative usage including corrections }
        occurredAt: { type: string, format: date-time }
        sourceRecovery:
          oneOf:
            - { $ref: '#/components/schemas/RecoverySource' }
            - { type: 'null' }
    UsagePagination:
      type: object
      additionalProperties: false
      required: [page, pageSize, total, totalQuantity, billId, periodStart, periodEnd]
      properties:
        page: { type: integer, minimum: 1, maximum: 1000 }
        pageSize: { type: integer, enum: [10, 25, 50, 100] }
        total: { type: integer, minimum: 0 }
        totalQuantity: { type: number, description: Signed sum of filtered matching UsageEvents }
        billId: { type: [string, 'null'], maxLength: 191 }
        periodStart: { type: [string, 'null'], format: date-time }
        periodEnd: { type: [string, 'null'], format: date-time }
    UsageHistory:
      type: object
      additionalProperties: false
      required: [schemaVersion, state, usageView, periodPage, usageEvents, usagePagination]
      properties:
        schemaVersion: { type: integer, const: 1 }
        state: { type: string, enum: [ready, unavailable] }
        usageView: { type: string, enum: [current, past] }
        periodPage: { $ref: '#/components/schemas/PeriodPage' }
        usageEvents:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/UsageEvent' }
        usagePagination: { $ref: '#/components/schemas/UsagePagination' }
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          enum: [invalid_request, unauthorized, invalid_cursor, invalid_period, usage_history_integrity_invalid, internal_error]
  responses:
    BadRequest:
      description: Unknown, duplicate or malformed query parameter or GET request body
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing, wrong-platform, suspended, disconnected or revoked Woo installation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Foreign/invalid period, invalid/tampered cursor or inconsistent billing state
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Internal:
      description: Internal failure without sensitive details
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
